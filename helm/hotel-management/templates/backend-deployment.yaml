apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: hotel-backend

  template:
    metadata:
      labels:
        app: hotel-backend

    spec:
      containers:
        - name: hotel-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: {{ .Values.backend.port }}

          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"

            - name: JWT_SECRET
              value: "hotel-management-secret"

            - name: MONGO_URI
              value: "mongodb://mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/hotel_management?replicaSet=rs0"
