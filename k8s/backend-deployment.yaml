apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: hotel-backend

  template:
    metadata:
      labels:
        app: hotel-backend

    spec:
      containers:
        - name: hotel-backend
          image: riteshbansode/hotel-backend:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: JWT_SECRET
              value: "hotel-management-secret"

            - name: MONGO_URI
              value: "mongodb://mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/hotel_management?replicaSet=rs0"
